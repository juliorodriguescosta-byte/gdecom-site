<svg viewBox="0 0 480 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Ilustração de pessoas da comunidade GDECOM lado a lado, sob um sol, com casinhas ao fundo</title>

  <!-- fundo -->
  <rect x="0" y="0" width="480" height="504" fill="#eaf2fb"/>

  <!-- morro com casinhas -->
  <path d="M0 300 Q120 250 240 285 T480 270 V504 H0 Z" fill="#cfe3f4"/>
  <g>
    <rect x="40" y="250" width="58" height="58" rx="6" fill="#f2c200"/>
    <polygon points="40,250 69,225 98,250" fill="#e0a800"/>
    <rect x="120" y="270" width="52" height="50" rx="6" fill="#ffffff"/>
    <polygon points="120,270 146,248 172,270" fill="#a9c2cf"/>
    <rect x="330" y="262" width="60" height="58" rx="6" fill="#06357e"/>
    <polygon points="330,262 360,236 390,262" fill="#052a63"/>
    <rect x="400" y="278" width="50" height="46" rx="6" fill="#ffffff"/>
    <polygon points="400,278 425,256 450,278" fill="#a9c2cf"/>
  </g>

  <!-- sol -->
  <circle cx="380" cy="96" r="46" fill="#f2c200"/>
  <g stroke="#f2c200" stroke-width="8" stroke-linecap="round">
    <line x1="380" y1="18" x2="380" y2="34"/>
    <line x1="380" y1="158" x2="380" y2="174"/>
    <line x1="302" y1="96" x2="318" y2="96"/>
    <line x1="442" y1="96" x2="458" y2="96"/>
    <line x1="326" y1="42" x2="337" y2="53"/>
    <line x1="423" y1="139" x2="434" y2="150"/>
    <line x1="434" y1="42" x2="423" y2="53"/>
    <line x1="337" y1="139" x2="326" y2="150"/>
  </g>

  <!-- estrelas soltas -->
  <path d="M74 70l7.8 18.6 20.1 1.5-15.3 13.2 4.8 19.8L74 112.9l-17.4 10.2 4.8-19.8-15.3-13.2 20.1-1.5z" fill="#f2c200" stroke="#06357e" stroke-width="3"/>
  <path d="M430 210l5.4 12.9 13.9 1-10.6 9.1 3.3 13.7-11.9-7.4-11.9 7.4 3.3-13.7-10.6-9.1 13.9-1z" fill="#ffffff" stroke="#06357e" stroke-width="3"/>

  <!-- chão -->
  <rect x="0" y="420" width="480" height="84" fill="#dcebd6"/>

  <!-- pessoas: três figuras de mãos dadas -->
  <g>
    <!-- pessoa esquerda -->
    <circle cx="120" cy="330" r="34" fill="#a9744f"/>
    <path d="M76 470c0-40 28-66 44-66s44 26 44 66z" fill="#06357e"/>
    <!-- pessoa centro -->
    <circle cx="240" cy="308" r="40" fill="#7a4b2e"/>
    <path d="M188 470c0-46 30-76 52-76s52 30 52 76z" fill="#f2c200"/>
    <!-- pessoa direita -->
    <circle cx="360" cy="330" r="34" fill="#e8b48a"/>
    <path d="M316 470c0-40 28-66 44-66s44 26 44 66z" fill="#0a4db5"/>
    <!-- mãos dadas -->
    <rect x="150" y="420" width="42" height="14" rx="7" fill="#a9744f"/>
    <rect x="288" y="410" width="42" height="14" rx="7" fill="#7a4b2e"/>
  </g>

  <!-- sorrisos simples -->
  <g stroke="#06357e" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M108 336q12 10 24 0"/>
    <path d="M226 314q14 12 28 0"/>
    <path d="M348 336q12 10 24 0"/>
  </g>
</svg>
